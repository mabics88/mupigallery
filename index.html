<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090909">
<title>...mas eu quero te contar. | Emissão</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #090909; color: #ededed; font: 16px/1.5 system-ui, sans-serif; }
  main { width: min(92vw, 540px); padding: 2rem 0; }
  h1 { font-size: clamp(1.7rem, 6vw, 2.8rem); font-weight: 400; letter-spacing: -.035em; line-height: 1.1; margin: 0 0 2.8rem; }
  .label { font-size: .75rem; text-transform: uppercase; letter-spacing: .2em; opacity: .55; margin-bottom: 1rem; }
  button { background: transparent; color: inherit; border: 1px solid #777; border-radius: 0; font: inherit; cursor: pointer; padding: .85rem 1.2rem; min-width: 12rem; }
  button:disabled { opacity: .4; cursor: wait; }
  #status { margin-top: 1.3rem; font-size: .85rem; color: #aaa; min-height: 1.5em; }
  footer { margin-top: 4rem; font-size: .75rem; opacity: .45; }
</style>
</head>
<body>
<main>
  <p class="label">Emissão contínua · áudio independente</p>
  <h1>...mas eu quero te contar.</h1>
  <button id="toggle">Ouvir emissão</button>
  <p id="status" role="status">Entra no ponto em que a emissão se encontra.</p>
  <footer>Para ouvir, mantém esta página aberta.</footer>
  <audio id="audio" src="audio.mp3" preload="metadata" playsinline></audio>
</main>
<script>
  // ALTERAR SE DESEJADO: início de referência, em UTC.
  // 2026-11-07T18:00:00Z corresponde a 18:00 em Portugal continental neste dia.
  const inicioDaEmissao = Date.parse('2026-11-07T18:00:00Z');
  const audio = document.getElementById('audio');
  const botao = document.getElementById('toggle');
  const estado = document.getElementById('status');
  let ativo = false;

  function posicaoAtual() {
    if (!Number.isFinite(audio.duration) || audio.duration <= 0) return null;
    const segundos = (Date.now() - inicioDaEmissao) / 1000;
    return ((segundos % audio.duration) + audio.duration) % audio.duration;
  }
  function sincronizar(forcar = false) {
    const alvo = posicaoAtual();
    if (alvo === null || !audio.seekable.length) return;
    const diferenca = Math.abs(audio.currentTime - alvo);
    const circular = Math.min(diferenca, audio.duration - diferenca);
    if (forcar || circular > 1.5) {
      try { audio.currentTime = alvo; } catch (_) { /* tentar quando disponível */ }
    }
  }
  async function iniciar() {
    botao.disabled = true;
    estado.textContent = 'A ligar à emissão…';
    try {
      sincronizar(true);
      await audio.play();
      ativo = true;
      sincronizar(true);
      botao.textContent = 'Pausar';
      estado.textContent = 'Emissão em curso';
    } catch (e) {
      estado.textContent = 'Não foi possível tocar. Confirma a ligação e tenta novamente.';
    } finally { botao.disabled = false; }
  }
  botao.addEventListener('click', () => {
    if (ativo && !audio.paused) {
      audio.pause(); ativo = false;
      botao.textContent = 'Retomar emissão';
      estado.textContent = 'Em pausa. Ao retomar, voltas ao ponto atual.';
    } else { iniciar(); }
  });
  audio.addEventListener('loadedmetadata', () => { if (ativo) sincronizar(true); });
  audio.addEventListener('ended', async () => {
    if (!ativo) return;
    sincronizar(true);
    try { await audio.play(); } catch (_) { estado.textContent = 'Toca em «Retomar emissão» para continuar.'; }
  });
  audio.addEventListener('error', () => { estado.textContent = 'Áudio indisponível. Confirma que existe um ficheiro chamado audio.mp3.'; });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && ativo) sincronizar(true); });
  setInterval(() => { if (ativo && !audio.paused) sincronizar(); }, 15000);
</script>
</body>
</html>
